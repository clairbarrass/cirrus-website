title: "Cirrus - Migration to EPCCFS storage"
description: >
  <p>
  On Wednesday 16th September, Cirrus will migrate to using the EPCCFS
  </p>
  <p>
    <ul>
        <li>The maintenance will begin at 09:00</li>
        <ul>
            <li> Pending jobs will be deleted</li>
            <li>/work will be changed to read-only</li>
            <li>/epccfs will be made available read-write</li>
        </ul>
    </ul>
  </p>
  <p>
  Full details in the Documentation
  </p>
image: "img/carousel/CirrusEX_cabinets.png"
href: "https://docs.cirrus.ac.uk/epccfs-migration-2026/"
